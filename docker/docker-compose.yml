name: lms
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data  # Lưu trữ dữ liệu Redis

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - frappe-temp:/tmp  # Lưu trữ bộ nhớ tạm
    ports:
      - 8000:8000
      - 9001:9000

volumes:
  mariadb-data:
  redis-data:  # Định nghĩa volume cho Redis
  frappe-temp:  # Định nghĩa volume cho bộ nhớ tạm